<!DOCTYPE html>
<html>
<head>
    <title>ProcrastiSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-3">
    ProcrastiSense AI
</h1>

<p class="text-center text-muted">
    Analyze your productivity habits and identify procrastination patterns.
</p>

        <form action="/analyze" method="POST">

            <input class="form-control mb-3" type="number" name="planned" placeholder="Planned Study Hours" required>

            <input class="form-control mb-3" type="number" name="actual" placeholder="Actual Study Hours" required>

            <input class="form-control mb-3" type="number" name="assigned" placeholder="Tasks Assigned" required>

            <input class="form-control mb-3" type="number" name="completed" placeholder="Tasks Completed" required>

            <input class="form-control mb-3" type="number" name="screen" placeholder="Screen Time (Hours)" required>

            <input class="form-control mb-3" type="number" name="sleep" placeholder="Sleep Hours" required>

            <button class="btn btn-primary w-100">
                Analyze
            </button>

        </form>

    </div>

</div>

</body>
</html>
